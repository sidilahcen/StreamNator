name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, principal, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --no-parallel --stacktrace 2>&1 | tee build.log
          echo "=== CAUSE EXACTE ==="
          grep -nE "Cannot mutate|debugCompileClasspath|Caused by:|> Task .* FAILED" build.log -B 2 -A 5 || true
          exit 1

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamNator-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
